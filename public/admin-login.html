<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — IT.Москва</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .admin-login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.14), transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(79, 70, 229, 0.14), transparent 45%),
        linear-gradient(160deg, #eef2ff 0%, #f5f3ff 50%, #ede9fe 100%);
    }
    .admin-login__card {
      width: 100%;
      max-width: 400px;
      background: var(--color-white);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 24px 60px rgba(79, 70, 229, 0.16);
      animation: fadeIn 0.4s ease;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .admin-login__badge {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
    }
    .admin-login__header {
      text-align: center;
      margin-bottom: 28px;
    }
    .admin-login__header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .admin-login__header p {
      color: var(--color-text-secondary);
      font-size: 0.9rem;
    }
    .admin-login__back {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .admin-login__back:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="admin-login">
    <div class="admin-login__card">
      <div class="admin-login__header">
        <div class="admin-login__badge">🔐</div>
        <h1>Вход для администратора</h1>
        <p>IT.Москва — Голосование за обед</p>
      </div>

      <form id="adminLoginForm">
        <div class="form-group">
          <label for="adminUsername">Логин</label>
          <input type="text" id="adminUsername" name="username" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="adminPassword">Пароль</label>
          <input type="password" id="adminPassword" name="password" placeholder="••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--primary btn--full">Войти</button>
        <p class="auth-form__error" id="adminLoginError"></p>
      </form>

      <a href="/" class="admin-login__back">← На главную</a>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('adminLoginError');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!(res.headers.get('content-type') || '').includes('application/json')) {
          throw new Error('Сервер недоступен (нет API). Запустите Node.js-сервер.');
        }

        let data;
        try {
          data = await res.json();
        } catch (e) {
          throw new Error('Сервер вернул некорректный ответ');
        }

        if (!res.ok) throw new Error(data.error || 'Ошибка входа');
        window.location.href = '/admin';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
